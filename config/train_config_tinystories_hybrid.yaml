# NVIDIA Nemotron-H ideas: mostly SSD mixers, sparse shared/routed MoE, MTP.
model:
  type: hybrid
  vocab_size: 10000
  d_model: 448
  n_layers: 8
  n_heads: 7
  layer_pattern: "MFMFMFAF" # separate Mamba / FFN / sparse-attention residual layers
  mamba_heads: 7
  state_size: 16
  conv_kernel: 4
  d_ffn: 320
  n_experts: 8               # routed experts plus one always-on shared expert
  top_k: 2                   # NVIDIA-style sparse top-k routing
  mtp_weight: 0.3            # may decay to 0.1 during training
  aux_weight: 0.0001
  max_seq_len: 512
  dropout: 0.1
  tie_embeddings: true
training:
  batch_size: 64
  num_epochs: 5
  gradient_accumulation_steps: 4
  use_bf16: true
  use_gradient_checkpointing: false
  use_compile: false
  logging_steps: 10
  eval_steps: 200
  eval_samples: 1000
  early_stopping_patience: 3
  save_steps: 1000
  show_progress: true
  use_wandb: false
  output_dir: "./checkpoints"
optimizer:
  learning_rate: 0.0005
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 0.00000001
  weight_decay: 0.1
  max_grad_norm: 1.0
scheduler:
  type: cosine
  warmup_steps: 100
  lr_decay_iters: 35000
  min_lr: 0.00005
data:
  dataset: "tinystories"
  tokenizer_path: "./tokenizer/tinystories_10k"
  cache_dir: "./data/cache"
  max_seq_len: 512
  check_quality: true
  quality_sample_size: 10000
  quality_strict: false
hardware:
  device: "cuda"
  num_gpus: 1
